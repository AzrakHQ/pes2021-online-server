# Tests the server, builds it as one program for Linux (x64, arm64) and publishes it as the
# repository's latest release, which run.sh downloads (hosts run Linux only; the Windows job below
# checks the players' mod, not the server):
#   https://github.com/<owner>/pes2021-private-server/releases/latest/download/pes2021-server-<platform>
name: program
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/program.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: program
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install msgpack==1.1.0 cryptography==44.0.1 pyopenssl==25.1.0 pytest && cd server && python -m pytest -q

  mod:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's own archive, not the runner's Azure mirror (it stopped resolving on 2026-11-11 for hours)
      - run: echo http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt && sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 && sh server/mod/build.sh dinput8.dll
      - name: Math check program and its Linux reference (server/mod/musl-math/README.md)
        run: |
          cd server/mod && mkdir -p ../../mathcheck ref
          x86_64-w64-mingw32-gcc -O2 -march=x86-64 -mno-fma -ffp-contract=off -o ../../mathcheck/mathcheck.exe test/mathcheck.c
          for f in musl-math/*.c; do
            gcc -O2 -march=x86-64 -mno-fma -ffp-contract=off -fno-fast-math -fno-builtin -Imusl-math -Imusl-math/include \
              -include musl-math/pesm_names.h -w -c "$f" -o "ref/$(basename "$f" .c).o"
          done
          gcc -O2 -march=x86-64 -mno-fma -ffp-contract=off -fno-fast-math -o ref/mathcheck test/mathcheck.c ref/*.o
          ref/mathcheck > ../../mathcheck/reference.txt && cp dinput8.dll ../../mathcheck/
      - uses: actions/upload-artifact@v4
        with: { name: mod, path: server/mod/dinput8.dll }
      - uses: actions/upload-artifact@v4
        with: { name: mathcheck, path: mathcheck }

  mathcheck:
    # The mod must give the game the same math on Windows as everywhere else (musl-math/README.md).
    needs: mod
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mathcheck, path: mc }
      - run: |
          cd mc && ./mathcheck.exe | tr -d '\r' > out.txt
          echo "Microsoft's own functions that differ from the mod's:"; sed 's/^native //;t;d' out.txt | diff - reference.txt | grep '^<' || true
          grep -v '^native \|^apiset ' out.txt | diff - reference.txt
          sed 's/^apiset //;t;d' out.txt | diff - reference.txt
          cat pes2021-online.log
          grep -q "same-math functions on" pes2021-online.log && ! grep -q "ERROR" pes2021-online.log

  build:
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        include:          # Linux builds on the oldest supported Ubuntu, so they run on older distros too
          - { os: ubuntu-22.04, file: pes2021-server-linux-x64 }
          - { os: ubuntu-22.04-arm, file: pes2021-server-linux-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: mod, path: server/mod }
      - run: pip install pyinstaller==6.22.3 msgpack==1.1.0 cryptography==44.0.1 pyopenssl==25.1.0
      - name: Version stamp
        run: |
          v="$(git log -1 --format=%cd --date=format:%Y-%m-%d) ($(git rev-parse --short=7 HEAD))"
          printf 'VERSION = "%s"\nCOMMIT = "%s"\n' "$v" "$GITHUB_SHA" > server/pesserver/_build.py
      - run: sh server/packaging/build.sh ${{ matrix.file }}
      - run: git log -1 --format="%cd (%h)" --date=format:%Y-%m-%d --abbrev=7 > server/dist/version.txt
      - name: Smoke test
        run: |
          exe=server/dist/${{ matrix.file }}; [ -f "$exe.exe" ] && exe="$exe.exe"
          python server/packaging/smoke.py "$exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: |
            server/dist/${{ matrix.file }}*
            server/dist/version.txt

  release:
    needs: [build, mathcheck]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: "pes2021-server-*", merge-multiple: true }
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd out && ls -l
          sha256sum pes2021-server-* > SHA256SUMS        # the server's own updater checks downloads against it
          cat SHA256SUMS
          v="$(cat version.txt)"
          gh release delete program -R "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create program -R "$REPO" --target "$GITHUB_SHA" --latest --title "PES 2021 server $v" \
            --notes "The server as one program. Start it with the line on the website (it always downloads this newest version), or download the file for your computer and run it. Linux and Steam Deck." \
            pes2021-server-* version.txt SHA256SUMS
