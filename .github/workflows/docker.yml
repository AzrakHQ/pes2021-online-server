# Builds the server image and publishes it to GitHub's container registry:
#   ghcr.io/<owner>/pes2021-private-server:latest   (amd64 + arm64, e.g. Raspberry Pi / ARM VPS)
name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: pip install msgpack==1.1.0 cryptography==44.0.1 pytest && cd server && python -m pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - id: ver                  # e.g. "2026-11-05 (729c491)", or the tag name for a v* release
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"
          else v="$(git log -1 --format=%cd --date=format:%Y-%m-%d) ($(git rev-parse --short=7 HEAD))"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          build-args: |
            PES_VERSION=${{ steps.ver.outputs.version }}
            PES_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
