# Same server, using the host's network directly (Linux only).
# Use this when you host on Linux AND play on the same PC: the game's network test sends UDP on a
# socket bound to the network card, which cannot reach Docker's internal bridge.
#   echo "PUBLIC_IP=192.168.1.50" > .env
#   echo "COMPOSE_FILE=docker-compose.host.yml" >> .env
#   docker compose up -d --build
services:
  pesserver:
    build: ./server
    container_name: pesserver
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
      HTTPS_PORT: "443"
    volumes:
      - ./server-data:/data
