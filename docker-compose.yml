# PES 2021 private server (Linux host / VPS). No configuration needed:
#   docker compose up -d && docker compose logs pesserver     # the log shows the admin page and password
# Optional (in .env or the environment): PUBLIC_IP=<addr> to pin the address handed to players
# (VPN/Tailscale IP, domain-less VPS); UPNP=0 to not touch the router.
services:
  pesserver:
    image: ghcr.io/mohamedalirashad/pes2021-private-server:latest
    build: ./server
    container_name: pesserver
    restart: unless-stopped
    network_mode: host      # the game's NAT test needs the real network (and UPnP needs the LAN)
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
      UPNP: ${UPNP:-1}
    volumes:
      - ./server-data:/data
