<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="PES 2021 private server: the host runs one command, friends join with one line, and the match runs player to player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a37"/>
      <stop offset="1" stop-color="#05251b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ccf8e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3ccf8e" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ccf8e"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <!-- pitch -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.025">
    <rect x="0" width="128" height="640"/><rect x="256" width="128" height="640"/><rect x="512" width="128" height="640"/>
    <rect x="768" width="128" height="640"/><rect x="1024" width="128" height="640"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <rect x="24" y="24" width="1232" height="592" rx="6"/>
    <line x1="640" y1="24" x2="640" y2="616"/>
    <circle cx="640" cy="320" r="92"/>
    <rect x="24" y="190" width="120" height="260"/>
    <rect x="1136" y="190" width="120" height="260"/>
  </g>

  <!-- headline -->
  <text x="72" y="92" class="sans" font-size="17" font-weight="700" letter-spacing="3" fill="#8fe3bd">PRIVATE SERVER · FREE · NO ADMIN RIGHTS</text>
  <text x="72" y="152" class="sans" font-size="54" font-weight="800" fill="#ffffff">PES 2021 is back online</text>
  <text x="72" y="194" class="sans" font-size="23" fill="#cfe9dc">Host your own server with one command. Friends get one small file. Then just play.</text>

  <!-- the one command -->
  <rect x="72" y="222" width="560" height="46" rx="10" fill="#03150f" fill-opacity="0.75" stroke="#3ccf8e" stroke-opacity="0.45"/>
  <text x="92" y="252" class="mono" font-size="18" fill="#3ccf8e">$</text>
  <text x="114" y="252" class="mono" font-size="18" fill="#e8f6ef">curl -fsSL …/install.sh | sh</text>
  <text x="440" y="251" class="sans" font-size="16" fill="#8fe3bd">← the host, once</text>

  <!-- links -->
  <line x1="332" y1="420" x2="482" y2="420" stroke="#3ccf8e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="948" y1="420" x2="798" y2="420" stroke="#3ccf8e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="407" y="406" class="sans" font-size="15" fill="#cfe9dc" text-anchor="middle">login</text>
  <text x="407" y="444" class="sans" font-size="15" fill="#cfe9dc" text-anchor="middle">matchmaking</text>
  <text x="873" y="406" class="sans" font-size="15" fill="#cfe9dc" text-anchor="middle">login</text>
  <text x="873" y="444" class="sans" font-size="15" fill="#cfe9dc" text-anchor="middle">matchmaking</text>

  <!-- the match itself: player to player -->
  <path d="M202,500 Q640,596 1078,500" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="10 9"/>
  <g transform="translate(486,590)">
    <rect x="-14" y="-20" width="336" height="40" rx="20" fill="#05251b" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="13" cy="0" r="13" fill="#ffffff"/>
    <polygon points="13,-6 18.7,-1.9 16.5,4.9 9.5,4.9 7.3,-1.9" fill="#05251b"/>
    <text x="36" y="6" class="sans" font-size="18" font-weight="600" fill="#ffffff">The match runs player to player</text>
  </g>

  <!-- player A -->
  <g transform="translate(72,330)">
    <rect width="260" height="170" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
    <g transform="translate(88,22)">
      <rect width="84" height="46" rx="23" fill="#ffffff"/>
      <rect x="16" y="20" width="18" height="6" rx="2" fill="#0c4a37"/><rect x="22" y="14" width="6" height="18" rx="2" fill="#0c4a37"/>
      <circle cx="58" cy="18" r="5" fill="#0c4a37"/><circle cx="67" cy="28" r="5" fill="#3ccf8e"/>
    </g>
    <text x="130" y="100" class="sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Player A</text>
    <rect x="18" y="116" width="224" height="34" rx="8" fill="#03150f" fill-opacity="0.7"/>
    <text x="130" y="138" class="mono" font-size="14" fill="#e8f6ef" text-anchor="middle">dinput8.dll</text>
  </g>

  <!-- player B -->
  <g transform="translate(948,330)">
    <rect width="260" height="170" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
    <g transform="translate(88,22)">
      <rect width="84" height="46" rx="23" fill="#ffffff"/>
      <rect x="16" y="20" width="18" height="6" rx="2" fill="#0c4a37"/><rect x="22" y="14" width="6" height="18" rx="2" fill="#0c4a37"/>
      <circle cx="58" cy="18" r="5" fill="#0c4a37"/><circle cx="67" cy="28" r="5" fill="#3ccf8e"/>
    </g>
    <text x="130" y="100" class="sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Player B</text>
    <rect x="18" y="116" width="224" height="34" rx="8" fill="#03150f" fill-opacity="0.7"/>
    <text x="130" y="138" class="mono" font-size="13" fill="#e8f6ef" text-anchor="middle">dinput8.dll</text>
  </g>

  <!-- server -->
  <g transform="translate(490,312)">
    <rect width="300" height="200" rx="18" fill="url(#srv)" stroke="#3ccf8e" stroke-width="2"/>
    <g transform="translate(115,22)">
      <rect width="70" height="18" rx="5" fill="#ffffff"/><circle cx="58" cy="9" r="4" fill="#3ccf8e"/>
      <rect y="24" width="70" height="18" rx="5" fill="#ffffff"/><circle cx="58" cy="33" r="4" fill="#3ccf8e"/>
      <rect y="48" width="70" height="18" rx="5" fill="#ffffff"/><circle cx="58" cy="57" r="4" fill="#3ccf8e"/>
    </g>
    <text x="150" y="122" class="sans" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Your server</text>
    <text x="150" y="148" class="sans" font-size="15" fill="#cfe9dc" text-anchor="middle">Linux or Docker Desktop · free web link</text>
    <text x="150" y="176" class="sans" font-size="15" fill="#8fe3bd" text-anchor="middle">admin page · results · league table</text>
  </g>
</svg>
